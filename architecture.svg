  <text x="750" y="50" text-anchor="middle" class="title">AI Career Mentor - Production Architecture</text>
  <text x="750" y="78" text-anchor="middle" class="subtitle">Next.js frontend + FastAPI backend + JWT auth + AutoGen agents + Postgres-ready deployment</text>

