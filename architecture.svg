  <text x="117" y="318" text-anchor="middle" class="box-text">Student / Developer</text>

  <rect x="250" y="115" width="260" height="420" class="lane" />
  <text x="380" y="145" text-anchor="middle" class="lane-title">Frontend</text>
  <text x="380" y="168" text-anchor="middle" class="subtitle">Vercel / Local :3000</text>

