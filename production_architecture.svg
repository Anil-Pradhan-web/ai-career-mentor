<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="svgtitle svgdesc">
  <title id="svgtitle">AI Career Mentor — Zero-Cost Production Stack</title>
  <desc id="svgdesc">Full zero-cost production architecture: Vercel, Render, Neon Postgres, Upstash Redis, Cloudflare R2, Groq, Google/GitHub OAuth, Resend, Sentry, UptimeRobot, GitHub Actions.</desc>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#3b82f6"/>
    </marker>
    <marker id="arr-gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arr-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#f59e0b"/>
    </marker>
    <filter id="sh">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      text { font-family: Arial, sans-serif; }
      .t-title { font-size: 26px; font-weight: 800; fill: #0f172a; }
      .t-sub   { font-size: 13px; font-weight: 400; fill: #64748b; }
      .t-lane  { font-size: 13px; font-weight: 700; fill: #475569; }
      .t-card  { font-size: 13px; font-weight: 800; }
      .t-small { font-size: 11px; font-weight: 400; fill: #64748b; }
      .t-badge { font-size: 10px; font-weight: 700; }
      .t-conn  { font-size: 10px; font-weight: 600; fill: #475569; }
    </style>
  </defs>

  <!-- Page background -->
  <rect width="1400" height="780" fill="#f8fafc"/>

  <!-- Title -->
  <text x="700" y="40" text-anchor="middle" class="t-title">AI Career Mentor — Zero-Cost Production Stack</text>
  <text x="700" y="62" text-anchor="middle" class="t-sub">100% Free Tier · No Credit Card · Production-Ready · April 2026</text>

  <!-- ═══════════════════════════════════════════════════════
       LANE 1 — Request Flow
  ════════════════════════════════════════════════════════ -->
  <rect x="24" y="78" width="1352" height="215" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="44" y="100" class="t-lane">① Request &amp; Response Flow</text>

  <!-- User/Browser -->
  <rect x="44" y="112" width="140" height="80" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2" filter="url(#sh)"/>
  <text x="114" y="146" text-anchor="middle" class="t-card" fill="#0f172a">User Browser</text>
  <text x="114" y="163" text-anchor="middle" class="t-small">React SPA</text>
  <text x="114" y="180" text-anchor="middle" class="t-small">JWT in memory</text>

  <!-- Arrow → Vercel -->
  <line x1="184" y1="152" x2="222" y2="152" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="203" y="144" text-anchor="middle" class="t-conn">HTTPS</text>

  <!-- Vercel -->
  <rect x="225" y="108" width="190" height="90" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" filter="url(#sh)"/>
  <text x="320" y="138" text-anchor="middle" class="t-card" fill="#4c1d95">Vercel Hobby</text>
  <text x="320" y="155" text-anchor="middle" class="t-small">Next.js 16 · React 19</text>
  <text x="320" y="171" text-anchor="middle" class="t-small">TypeScript · Free SSL</text>
  <rect x="255" y="183" width="130" height="15" rx="7" fill="#7c3aed" opacity="0.12"/>
  <text x="320" y="194" text-anchor="middle" class="t-badge" fill="#6d28d9">Unlimited Deploys · Free</text>

  <!-- Arrow → Render -->
  <line x1="415" y1="152" x2="460" y2="152" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="437" y="143" text-anchor="middle" class="t-conn">REST / WS</text>

  <!-- Render FastAPI -->
  <rect x="463" y="100" width="255" height="165" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#sh)"/>
  <text x="590" y="130" text-anchor="middle" class="t-card" fill="#1e3a8a">Render Free</text>
  <text x="590" y="148" text-anchor="middle" class="t-small">FastAPI + Uvicorn</text>
  <text x="590" y="164" text-anchor="middle" class="t-small">REST API + WebSocket</text>
  <!-- sub-box: BG Tasks -->
  <rect x="480" y="174" width="220" height="44" rx="8" fill="#fff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="590" y="193" text-anchor="middle" class="t-badge" fill="#1d4ed8">⚙ FastAPI BackgroundTasks</text>
  <text x="590" y="209" text-anchor="middle" class="t-small">Long AI jobs · built-in · free</text>
  <rect x="490" y="233" width="200" height="15" rx="7" fill="#2563eb" opacity="0.10"/>
  <text x="590" y="244" text-anchor="middle" class="t-badge" fill="#1d4ed8">750 hrs/month · Sleeps after 15 min</text>

  <!-- Arrow → Groq -->
  <line x1="718" y1="158" x2="762" y2="158" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="740" y="149" text-anchor="middle" class="t-conn">LLM calls</text>

  <!-- Groq -->
  <rect x="765" y="110" width="190" height="90" rx="12" fill="#fae8ff" stroke="#a21caf" stroke-width="2" filter="url(#sh)"/>
  <text x="860" y="140" text-anchor="middle" class="t-card" fill="#701a75">Groq API</text>
  <text x="860" y="157" text-anchor="middle" class="t-small">LLaMA 3.3 70B · Fast Inf</text>
  <text x="860" y="173" text-anchor="middle" class="t-small">Edge TTS · DuckDuckGo</text>
  <rect x="790" y="185" width="140" height="15" rx="7" fill="#a21caf" opacity="0.10"/>
  <text x="860" y="196" text-anchor="middle" class="t-badge" fill="#86198f">14,400 req/day · Free</text>

  <!-- UptimeRobot (pinger) -->
  <rect x="1020" y="110" width="220" height="90" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#sh)"/>
  <text x="1130" y="140" text-anchor="middle" class="t-card" fill="#92400e">UptimeRobot</text>
  <text x="1130" y="157" text-anchor="middle" class="t-small">Pings /health every 5 min</text>
  <text x="1130" y="173" text-anchor="middle" class="t-small">Keeps Render warm · Alerts</text>
  <rect x="1050" y="185" width="160" height="15" rx="7" fill="#d97706" opacity="0.10"/>
  <text x="1130" y="196" text-anchor="middle" class="t-badge" fill="#b45309">50 monitors · Free</text>
  <!-- Arrow: UptimeRobot → Render (dashed) -->
  <line x1="1020" y1="155" x2="718" y2="155" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6,3" marker-end="url(#arr-orange)"/>

  <!-- ═══════════════════════════════════════════════════════
       LANE 2 — Data, Auth & Storage
  ════════════════════════════════════════════════════════ -->
  <rect x="24" y="308" width="1352" height="160" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="44" y="330" class="t-lane">② Data, Auth &amp; Storage</text>

  <!-- Neon Postgres -->
  <rect x="44" y="342" width="210" height="100" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#sh)"/>
  <text x="149" y="370" text-anchor="middle" class="t-card" fill="#1e40af">Neon Postgres</text>
  <text x="149" y="387" text-anchor="middle" class="t-small">users · resumes · roadmaps</text>
  <text x="149" y="403" text-anchor="middle" class="t-small">interview_sessions</text>
  <rect x="79" y="416" width="140" height="16" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="149" y="428" text-anchor="middle" class="t-badge" fill="#15803d">✅ DONE · 0.5 GB · Free</text>

  <!-- Upstash Redis -->
  <rect x="276" y="342" width="195" height="100" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#sh)"/>
  <text x="373" y="370" text-anchor="middle" class="t-card" fill="#7f1d1d">Upstash Redis</text>
  <text x="373" y="387" text-anchor="middle" class="t-small">Rate limits · caching</text>
  <text x="373" y="403" text-anchor="middle" class="t-small">session store</text>
  <rect x="308" y="416" width="130" height="16" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="373" y="428" text-anchor="middle" class="t-badge" fill="#b91c1c">10K cmds/day · Free</text>

  <!-- Cloudflare R2 -->
  <rect x="493" y="342" width="205" height="100" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#sh)"/>
  <text x="595" y="370" text-anchor="middle" class="t-card" fill="#7c2d12">Cloudflare R2</text>
  <text x="595" y="387" text-anchor="middle" class="t-small">Resume PDFs · exports</text>
  <text x="595" y="403" text-anchor="middle" class="t-small">career reports</text>
  <rect x="530" y="416" width="130" height="16" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="595" y="428" text-anchor="middle" class="t-badge" fill="#c2410c">10 GB storage · Free</text>

  <!-- OAuth -->
  <rect x="720" y="342" width="210" height="100" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#sh)"/>
  <text x="825" y="370" text-anchor="middle" class="t-card" fill="#14532d">OAuth Login</text>
  <text x="825" y="387" text-anchor="middle" class="t-small">Google OAuth 2.0</text>
  <text x="825" y="403" text-anchor="middle" class="t-small">GitHub OAuth</text>
  <rect x="760" y="416" width="130" height="16" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="825" y="428" text-anchor="middle" class="t-badge" fill="#15803d">Both 100% Free</text>

  <!-- Resend -->
  <rect x="952" y="342" width="200" height="100" rx="12" fill="#fdf4ff" stroke="#a855f7" stroke-width="2" filter="url(#sh)"/>
  <text x="1052" y="370" text-anchor="middle" class="t-card" fill="#581c87">Resend Email</text>
  <text x="1052" y="387" text-anchor="middle" class="t-small">Email verification</text>
  <text x="1052" y="403" text-anchor="middle" class="t-small">Password reset</text>
  <rect x="987" y="416" width="130" height="16" rx="8" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="1052" y="428" text-anchor="middle" class="t-badge" fill="#7e22ce">3K emails/month · Free</text>

  <!-- Dashed arrows Render → Data Layer -->
  <line x1="530" y1="265" x2="149" y2="342" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-gray)"/>
  <line x1="560" y1="265" x2="373" y2="342" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-gray)"/>
  <line x1="590" y1="265" x2="595" y2="342" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-gray)"/>
  <line x1="630" y1="265" x2="825" y2="342" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-gray)"/>
  <line x1="660" y1="265" x2="1052" y2="342" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-gray)"/>

  <!-- ═══════════════════════════════════════════════════════
       LANE 3 — DevOps, Monitoring & Security
  ════════════════════════════════════════════════════════ -->
  <rect x="24" y="484" width="1352" height="165" rx="14" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="44" y="506" class="t-lane">③ DevOps, Monitoring &amp; Security</text>

  <!-- GitHub Actions -->
  <rect x="44" y="518" width="220" height="100" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2" filter="url(#sh)"/>
  <text x="154" y="546" text-anchor="middle" class="t-card" fill="#0f172a">GitHub Actions</text>
  <text x="154" y="563" text-anchor="middle" class="t-small">Lint → Build → Test</text>
  <text x="154" y="579" text-anchor="middle" class="t-small">pip-audit · npm audit</text>
  <rect x="84" y="591" width="140" height="16" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="154" y="603" text-anchor="middle" class="t-badge" fill="#334155">2000 min/month · Free</text>

  <!-- Sentry -->
  <rect x="286" y="518" width="210" height="100" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="2" filter="url(#sh)"/>
  <text x="391" y="546" text-anchor="middle" class="t-card" fill="#881337">Sentry</text>
  <text x="391" y="563" text-anchor="middle" class="t-small">Error tracking</text>
  <text x="391" y="579" text-anchor="middle" class="t-small">Performance monitoring</text>
  <rect x="326" y="591" width="130" height="16" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="391" y="603" text-anchor="middle" class="t-badge" fill="#be123c">5K errors/month · Free</text>

  <!-- WS Auth Upgrade -->
  <rect x="518" y="518" width="225" height="100" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#sh)"/>
  <text x="630" y="546" text-anchor="middle" class="t-card" fill="#064e3b">WS Auth Upgrade</text>
  <text x="630" y="563" text-anchor="middle" class="t-small">One-time ticket system</text>
  <text x="630" y="579" text-anchor="middle" class="t-small">httpOnly cookie JWT</text>
  <rect x="563" y="591" width="135" height="16" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="630" y="603" text-anchor="middle" class="t-badge" fill="#15803d">FastAPI built-in · Free</text>

  <!-- Retry / Backoff -->
  <rect x="765" y="518" width="215" height="100" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2" filter="url(#sh)"/>
  <text x="872" y="546" text-anchor="middle" class="t-card" fill="#713f12">Retry / Backoff</text>
  <text x="872" y="563" text-anchor="middle" class="t-small">tenacity library</text>
  <text x="872" y="579" text-anchor="middle" class="t-small">LLM · TTS · Search retries</text>
  <rect x="807" y="591" width="130" height="16" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="872" y="603" text-anchor="middle" class="t-badge" fill="#92400e">pip install · Free</text>

  <!-- Dependency Audit -->
  <rect x="1002" y="518" width="215" height="100" rx="12" fill="#f8fafc" stroke="#6b7280" stroke-width="2" filter="url(#sh)"/>
  <text x="1109" y="546" text-anchor="middle" class="t-card" fill="#111827">Dep Audit</text>
  <text x="1109" y="563" text-anchor="middle" class="t-small">pip-audit (Python CVEs)</text>
  <text x="1109" y="579" text-anchor="middle" class="t-small">npm audit (JS CVEs)</text>
  <rect x="1044" y="591" width="130" height="16" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="1109" y="603" text-anchor="middle" class="t-badge" fill="#374151">In CI pipeline · Free</text>

  <!-- Footer -->
  <text x="700" y="675" text-anchor="middle" class="t-sub" font-size="12">Stack: Vercel · Render · Neon Postgres · Upstash Redis · Cloudflare R2 · Groq · Google/GitHub OAuth · Resend · Sentry · UptimeRobot · GitHub Actions</text>
  <text x="700" y="697" text-anchor="middle" class="t-sub" font-size="12" font-weight="700" fill="#0f172a">Total Monthly Cost: $0.00 ✦ Every service on free tier ✦ No credit card required</text>
</svg>
