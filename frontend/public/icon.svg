<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Radiant Modern Gradient (Indigo -> Electric Violet -> Vibrant Cyan) -->
    <linearGradient id="careerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="85%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Full-bleed squircle (fills 100% canvas, just like Instagram/LinkedIn) -->
  <rect width="128" height="128" rx="28" fill="url(#careerGrad)" />

  <!-- Bold, High-Contrast White AI Career Star & Compass (fills 85% of canvas) -->
  <g filter="url(#glow)">
    <!-- Primary 4-point AI Star -->
    <path d="M 64 16 Q 64 64 16 64 Q 64 64 64 112 Q 64 64 112 64 Q 64 64 64 16 Z" fill="#ffffff" />
    
    <!-- Secondary AI Sparkle in top-right -->
    <path d="M 98 22 Q 98 34 86 34 Q 98 34 98 46 Q 98 34 110 34 Q 98 34 98 22 Z" fill="#ffffff" />
    
    <!-- Center Core Lens Accent -->
    <circle cx="64" cy="64" r="8" fill="#4338ca" />
    <circle cx="64" cy="64" r="3.5" fill="#38bdf8" />
  </g>
</svg>
