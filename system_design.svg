<svg width="1200" height="1600" viewBox="0 0 1200 1600" xmlns="http://www.w3.org/2000/svg">
  <!-- Main Background -->
  <rect width="1200" height="1600" fill="#020617"/>

  <!-- Header -->
  <text x="600" y="60" text-anchor="middle" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="40" font-weight="bold">AI Career Mentor Architecture</text>
  <text x="600" y="95" text-anchor="middle" fill="#94A3B8" font-family="Arial, sans-serif" font-size="18">Production-Grade Multi-Agent Intelligence System</text>

  <!-- 👤 User -->
  <rect x="500" y="150" width="200" height="80" rx="40" fill="#0F172A" stroke="#38BDF8" stroke-width="3"/>
  <text x="600" y="200" text-anchor="middle" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="22" font-weight="bold">👤 User</text>

  <!-- Flow to Frontend -->
  <line x1="600" y1="230" x2="600" y2="280" stroke="#475569" stroke-width="3"/>

  <!-- ☁️ Frontend Layer -->
  <rect x="350" y="280" width="500" height="120" rx="30" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="600" y="325" text-anchor="middle" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="24" font-weight="bold">Frontend — Vercel</text>
  <text x="600" y="360" text-anchor="middle" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="16">Next.js 14 · TypeScript · Vanilla CSS</text>

  <!-- Flow to Backend -->
  <line x1="600" y1="400" x2="600" y2="450" stroke="#475569" stroke-width="3"/>

  <!-- ⚡ Backend Layer -->
  <rect x="300" y="450" width="600" height="240" rx="30" fill="#0D9488" stroke="#134E4A" stroke-width="2"/>
  <text x="600" y="495" text-anchor="middle" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="26" font-weight="bold">Backend Engine — Render (FastAPI)</text>
  
  <rect x="340" y="520" width="520" height="60" rx="15" fill="#0F766E"/>
  <text x="600" y="557" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" font-weight="bold">API Gateway (REST + WebSockets)</text>
  
  <rect x="340" y="600" width="250" height="60" rx="15" fill="#115E59"/>
  <text x="465" y="637" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16" font-weight="bold">SlowAPI Rate Limiter</text>
  
  <rect x="610" y="600" width="250" height="60" rx="15" fill="#115E59"/>
  <text x="735" y="637" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16" font-weight="bold">AI Response Cache</text>

  <!-- Flow to Orchestration -->
  <line x1="450" y1="690" x2="450" y2="750" stroke="#475569" stroke-width="3"/>
  <line x1="750" y1="690" x2="750" y2="750" stroke="#475569" stroke-width="3"/>

  <!-- 🧠 Orchestration Layer -->
  <!-- Analysis -->
  <rect x="100" y="750" width="480" height="380" rx="30" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="340" y="795" text-anchor="middle" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="24" font-weight="bold">AutoGen Analysis Suite</text>
  
  <rect x="140" y="820" width="400" height="60" rx="20" fill="#2563EB"/>
  <text x="340" y="857" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" font-weight="bold">GroupChat Manager</text>
  
  <rect x="140" y="900" width="190" height="80" rx="15" fill="#3B82F6"/>
  <text x="235" y="945" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16" font-weight="bold">📄 Resume</text>
  
  <rect x="350" y="900" width="190" height="80" rx="15" fill="#3B82F6"/>
  <text x="445" y="945" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16" font-weight="bold">📈 Market</text>
  
  <rect x="140" y="1000" width="190" height="80" rx="15" fill="#3B82F6"/>
  <text x="235" y="1045" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16" font-weight="bold">🗺️ Roadmap</text>
  
  <rect x="350" y="1000" width="190" height="80" rx="15" fill="#3B82F6"/>
  <text x="445" y="1045" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16" font-weight="bold">🔗 LinkedIn</text>

  <!-- Interview -->
  <rect x="620" y="750" width="480" height="150" rx="30" fill="#0284C7" stroke="#0C4A6E" stroke-width="2"/>
  <text x="860" y="795" text-anchor="middle" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="24" font-weight="bold">Streaming Engine</text>
  <rect x="660" y="820" width="400" height="60" rx="20" fill="#0369A1"/>
  <text x="860" y="857" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Mock Interviewer (Direct GROQ)</text>

  <!-- ⚙️ Core Engines -->
  <line x1="340" y1="1130" x2="340" y2="1180" stroke="#475569" stroke-width="3" stroke-dasharray="5,5"/>
  <line x1="860" y1="900" x2="860" y2="1180" stroke="#475569" stroke-width="3" stroke-dasharray="5,5"/>

  <rect x="100" y="1180" width="1000" height="150" rx="30" fill="#4F46E5" stroke="#4338CA" stroke-width="2"/>
  <text x="600" y="1225" text-anchor="middle" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="26" font-weight="bold">Intelligence & Logic Engines</text>
  
  <rect x="150" y="1245" width="200" height="60" rx="15" fill="#4338CA"/>
  <text x="250" y="1282" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16" font-weight="bold">ATS Engine</text>
  
  <rect x="380" y="1245" width="200" height="60" rx="15" fill="#4338CA"/>
  <text x="480" y="1282" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Market Engine</text>
  
  <rect x="620" y="1245" width="200" height="60" rx="15" fill="#4338CA"/>
  <text x="720" y="1282" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Search Engine</text>
  
  <rect x="850" y="1245" width="200" height="60" rx="15" fill="#4338CA"/>
  <text x="950" y="1282" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Voice Engine</text>

  <!-- 🤖 LLM Layer -->
  <line x1="110" y1="940" x2="50" y2="940" stroke="#475569" stroke-width="3"/>
  <line x1="50" y1="940" x2="50" y2="1400" stroke="#475569" stroke-width="3"/>
  <line x1="1100" y1="825" x2="1150" y2="825" stroke="#475569" stroke-width="3"/>
  <line x1="1150" y1="825" x2="1150" y2="1400" stroke="#475569" stroke-width="3"/>

  <rect x="100" y="1400" width="1000" height="150" rx="30" fill="#7C3AED" stroke="#5B21B6" stroke-width="2"/>
  <text x="600" y="1445" text-anchor="middle" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="26" font-weight="bold">LLM Layer (Gemini & GROQ)</text>
  
  <rect x="300" y="1465" width="280" height="60" rx="15" fill="#6D28D9"/>
  <text x="440" y="1502" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Gemini 1.5 Flash</text>
  
  <rect x="620" y="1465" width="280" height="60" rx="15" fill="#111827" stroke="#7C3AED" stroke-width="2"/>
  <text x="760" y="1502" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Groq (Llama 3.3)</text>

</svg>
