<svg width="2200" height="1350" viewBox="0 0 2200 1350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- BACKGROUND -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- SECTION GRADIENTS -->
    <linearGradient id="frontendGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>

    <linearGradient id="backendGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>

    <linearGradient id="orchGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="intelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B21B6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="llmGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7E22CE"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>

    <linearGradient id="dataGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>

    <!-- GLOW -->
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#38BDF8" flood-opacity="0.45"/>
    </filter>

    <!-- SHADOW -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <!-- ARROW -->
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#CBD5E1"/>
    </marker>

    <!-- STYLES -->
    <style>
      .title {
        font-family: Segoe UI, sans-serif;
        font-size: 44px;
        font-weight: 700;
        fill: white;
      }
      .subtitle {
        font-family: Segoe UI, sans-serif;
        font-size: 18px;
        fill: #CBD5E1;
      }
      .section {
        font-family: Segoe UI, sans-serif;
        font-size: 24px;
        font-weight: 700;
        fill: white;
      }
      .cardTitle {
        font-family: Segoe UI, sans-serif;
        font-size: 18px;
        font-weight: 700;
        fill: white;
      }
      .cardText {
        font-family: Segoe UI, sans-serif;
        font-size: 14px;
        fill: #E2E8F0;
      }
      .arrow {
        stroke: #CBD5E1;
        stroke-width: 4;
        fill: none;
        marker-end: url(#arrow);
      }
      .dashed {
        stroke-dasharray: 12 8;
      }
    </style>
  </defs>

  <!-- BACKGROUND -->
  <rect width="2200" height="1350" fill="url(#bg)"/>

  <!-- HEADER -->
  <text x="1100" y="65" text-anchor="middle" class="title">
    AI Career Mentor — High Level System Architecture
  </text>
  <text x="1100" y="100" text-anchor="middle" class="subtitle">
    Multi-Agent AI Career Platform · Production Grade Distributed Architecture
  </text>

  <!-- USER -->
  <g filter="url(#glow)">
    <rect x="60" y="560" width="220" height="110" rx="28" fill="#111827" stroke="#38BDF8" stroke-width="3"/>
    <text x="170" y="610" text-anchor="middle" class="cardTitle">👤 USER</text>
    <text x="170" y="640" text-anchor="middle" class="cardText">
      Web / Mobile Client
    </text>
  </g>

  <!-- FRONTEND -->
  <g filter="url(#shadow)">
    <rect x="360" y="420" width="350" height="380" rx="30" fill="url(#frontendGrad)"/>
    <text x="535" y="470" text-anchor="middle" class="section">
      ☁️ Frontend — Vercel
    </text>
    <rect x="420" y="540" width="230" height="100" rx="22" fill="#111827"/>
    <text x="535" y="590" text-anchor="middle" class="cardTitle">
      Next.js 14
    </text>
    <text x="535" y="620" text-anchor="middle" class="cardText">
      App Router + TypeScript
    </text>
    <rect x="420" y="670" width="230" height="90" rx="22" fill="#111827"/>
    <text x="535" y="715" text-anchor="middle" class="cardTitle">
      Responsive UI
    </text>
    <text x="535" y="740" text-anchor="middle" class="cardText">
      Desktop · Tablet · Mobile
    </text>
  </g>

  <!-- BACKEND -->
  <g filter="url(#shadow)">
    <rect x="830" y="320" width="420" height="600" rx="32" fill="url(#backendGrad)"/>
    <text x="1040" y="370" text-anchor="middle" class="section">
      ⚡ Backend — Render
    </text>
    <rect x="910" y="450" width="260" height="85" rx="20" fill="#0F766E"/>
    <text x="1040" y="495" text-anchor="middle" class="cardTitle">
      FastAPI Gateway
    </text>
    <text x="1040" y="520" text-anchor="middle" class="cardText">
      REST APIs + WebSockets
    </text>
    <rect x="910" y="580" width="260" height="85" rx="20" fill="#0F766E"/>
    <text x="1040" y="625" text-anchor="middle" class="cardTitle">
      SlowAPI Limiter
    </text>
    <text x="1040" y="650" text-anchor="middle" class="cardText">
      Abuse &amp; Traffic Protection
    </text>
    <rect x="910" y="710" width="260" height="85" rx="20" fill="#115E59"/>
    <text x="1040" y="755" text-anchor="middle" class="cardTitle">
      AI Response Cache
    </text>
    <text x="1040" y="780" text-anchor="middle" class="cardText">
      Faster Repeated Queries
    </text>
  </g>

  <!-- ORCHESTRATION -->
  <g filter="url(#shadow)">
    <rect x="1380" y="150" width="700" height="760" rx="34" fill="url(#orchGrad)"/>
    <text x="1730" y="205" text-anchor="middle" class="section">
      🧠 Multi-Agent Orchestration Layer
    </text>
    <!-- MANAGER -->
    <rect x="1540" y="270" width="380" height="100" rx="24" fill="#1D4ED8"/>
    <text x="1730" y="320" text-anchor="middle" class="cardTitle">
      Microsoft AutoGen GroupChatManager
    </text>
    <text x="1730" y="348" text-anchor="middle" class="cardText">
      Agent Coordination + Workflow Routing
    </text>
    <!-- AGENTS -->
    <rect x="1440" y="450" width="240" height="110" rx="24" fill="#2563EB"/>
    <text x="1560" y="505" text-anchor="middle" class="cardTitle">
      📄 Resume Analyst
    </text>
    <text x="1560" y="535" text-anchor="middle" class="cardText">
      ATS Score + Skill Gaps
    </text>
    <rect x="1780" y="450" width="240" height="110" rx="24" fill="#2563EB"/>
    <text x="1900" y="505" text-anchor="middle" class="cardTitle">
      📈 Market Researcher
    </text>
    <text x="1900" y="535" text-anchor="middle" class="cardText">
      Salary + Job Trends
    </text>
    <rect x="1440" y="620" width="240" height="110" rx="24" fill="#2563EB"/>
    <text x="1560" y="675" text-anchor="middle" class="cardTitle">
      🗺️ Career Coach
    </text>
    <text x="1560" y="705" text-anchor="middle" class="cardText">
      Personalized Roadmaps
    </text>
    <rect x="1780" y="620" width="240" height="110" rx="24" fill="#2563EB"/>
    <text x="1900" y="675" text-anchor="middle" class="cardTitle">
      🔗 LinkedIn Reviewer
    </text>
    <text x="1900" y="705" text-anchor="middle" class="cardText">
      SEO + Keyword Optimization
    </text>
    <!-- INTERVIEW -->
    <rect x="1600" y="790" width="260" height="90" rx="22" fill="#0EA5E9"/>
    <text x="1730" y="840" text-anchor="middle" class="cardTitle">
      🎤 Streaming Engine
    </text>
    <text x="1730" y="865" text-anchor="middle" class="cardText">
      Direct GROQ Integration
    </text>
  </g>

  <!-- INTELLIGENCE -->
  <g filter="url(#shadow)">
    <rect x="1380" y="980" width="700" height="250" rx="34" fill="url(#intelGrad)"/>
    <text x="1730" y="1035" text-anchor="middle" class="section">
      ⚙️ Core Intelligence Engines
    </text>
    <rect x="1430" y="1090" width="150" height="90" rx="20" fill="#6D28D9"/>
    <text x="1505" y="1135" text-anchor="middle" class="cardTitle">
      ATS Engine
    </text>
    <text x="1505" y="1160" text-anchor="middle" class="cardText">
      Deterministic Logic
    </text>
    <rect x="1600" y="1090" width="150" height="90" rx="20" fill="#6D28D9"/>
    <text x="1675" y="1135" text-anchor="middle" class="cardTitle">
      Market AI
    </text>
    <text x="1675" y="1160" text-anchor="middle" class="cardText">
      Regional Analysis
    </text>
    <rect x="1770" y="1090" width="150" height="90" rx="20" fill="#6D28D9"/>
    <text x="1845" y="1135" text-anchor="middle" class="cardTitle">
      Search Engine
    </text>
    <text x="1845" y="1160" text-anchor="middle" class="cardText">
      Resource Enrichment
    </text>
    <rect x="1940" y="1090" width="110" height="90" rx="20" fill="#6D28D9"/>
    <text x="1995" y="1135" text-anchor="middle" class="cardTitle">
      Voice
    </text>
    <text x="1995" y="1160" text-anchor="middle" class="cardText">
      Edge-TTS
    </text>
  </g>

  <!-- LLM -->
  <g filter="url(#shadow)">
    <rect x="830" y="1010" width="420" height="220" rx="32" fill="url(#llmGrad)"/>
    <text x="1040" y="1060" text-anchor="middle" class="section">
      🤖 LLM Layer
    </text>
    <rect x="880" y="1110" width="140" height="80" rx="18" fill="#7E22CE"/>
    <text x="950" y="1150" text-anchor="middle" class="cardTitle">
      GROQ
    </text>
    <text x="950" y="1175" text-anchor="middle" class="cardText">
      Llama 3.3 70B
    </text>
    <rect x="1060" y="1110" width="140" height="80" rx="18" fill="#7E22CE"/>
    <text x="1130" y="1150" text-anchor="middle" class="cardTitle">
      Gemini
    </text>
    <text x="1130" y="1175" text-anchor="middle" class="cardText">
      1.5 Flash
    </text>
  </g>

  <!-- DATA -->
  <g filter="url(#shadow)">
    <rect x="360" y="950" width="350" height="250" rx="32" fill="url(#dataGrad)"/>
    <text x="535" y="1000" text-anchor="middle" class="section">
      🗃️ Data Layer
    </text>
    <rect x="420" y="1060" width="230" height="70" rx="18" fill="#312E81"/>
    <text x="535" y="1103" text-anchor="middle" class="cardTitle">
      Neon PostgreSQL
    </text>
    <rect x="420" y="1150" width="230" height="70" rx="18" fill="#312E81"/>
    <text x="535" y="1193" text-anchor="middle" class="cardTitle">
      Upstash Redis
    </text>
  </g>

  <!-- DUCKDUCKGO -->
  <g filter="url(#glow)">
    <rect x="2060" y="1040" width="110" height="90" rx="22" fill="#EA580C"/>
    <text x="2115" y="1090" text-anchor="middle" class="cardTitle">
      DDG
    </text>
    <text x="2115" y="1115" text-anchor="middle" class="cardText">
      Search
    </text>
  </g>

  <!-- CONNECTIONS -->
  <!-- USER TO FRONTEND -->
  <path d="M280 615 L360 615" class="arrow"/>
  <!-- FRONTEND TO BACKEND -->
  <path d="M710 615 L830 615" class="arrow"/>
  <!-- BACKEND TO DATA -->
  <path d="M900 920 C850 980 760 1030 710 1070" class="arrow"/>
  <!-- BACKEND TO ORCH -->
  <path d="M1250 615 L1380 520" class="arrow"/>
  <!-- MANAGER TO AGENTS -->
  <path d="M1730 370 L1560 450" class="arrow"/>
  <path d="M1730 370 L1900 450" class="arrow"/>
  <path d="M1730 370 L1560 620" class="arrow"/>
  <path d="M1730 370 L1900 620" class="arrow"/>
  <!-- AGENTS TO INTELLIGENCE -->
  <path d="M1560 730 L1505 1090" class="arrow"/>
  <path d="M1900 730 L1675 1090" class="arrow"/>
  <path d="M1560 730 L1845 1090" class="arrow"/>
  <!-- STREAM TO VOICE -->
  <path d="M1730 880 L1995 1090" class="arrow"/>
  <!-- ORCH TO LLM -->
  <path d="M1500 910 C1450 980 1280 1080 1200 1110" class="arrow"/>
  <path d="M1850 910 C1750 980 1300 1130 1020 1140" class="arrow dashed"/>
  <!-- SEARCH TO DDG -->
  <path d="M1920 1135 L2060 1090" class="arrow dashed"/>

  <!-- LABELS -->
  <text x="770" y="595" fill="#CBD5E1" font-size="16">
    HTTPS / REST APIs
  </text>
  <text x="1310" y="500" fill="#CBD5E1" font-size="16">
    Agent Routing
  </text>
  <text x="1370" y="1030" fill="#CBD5E1" font-size="16">
    Deterministic Intelligence Layer
  </text>
</svg>
